name = "kinfusion-website"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./_site"
binding = "ASSETS"

[[kv_namespaces]]
binding = "RATE_KV"
id = "placeholder_replace_with_real_id"
preview_id = "placeholder_replace_with_real_preview_id"

[build]
command = "npm run build"

[env.preview]
name = "kinfusion-website-preview"
# APPS_SCRIPT_URL secret must be set via: wrangler secret put APPS_SCRIPT_URL --env preview
# Real URL set after T-2.1 (staging Apps Script deployed by human)

[env.production]
name = "kinfusion-website"
# All production secrets set via wrangler secret put ... --env production
