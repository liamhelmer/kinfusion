name = "kinfusion-website"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./_site"
binding = "ASSETS"

[[kv_namespaces]]
binding = "RATE_KV"
id = "placeholder_replace_with_real_id"
preview_id = "placeholder_replace_with_real_preview_id"

[build]
command = "npm run build"

[env.preview]
name = "kinfusion-website-preview"
# Secrets via: wrangler secret put <NAME> --env preview
# APPS_SCRIPT_URL — set after T-2.1 (staging Apps Script deployed)
# APPS_SCRIPT_HMAC_KEY — shared HMAC key with Apps Script
# FORM_TOKEN_SECRET — separate key for form token signing (if omitted, falls back to APPS_SCRIPT_HMAC_KEY)
# TURNSTILE_SECRET — Cloudflare Turnstile secret key

[env.production]
name = "kinfusion-website"
# Secrets via: wrangler secret put <NAME> --env production
# APPS_SCRIPT_URL, APPS_SCRIPT_HMAC_KEY, FORM_TOKEN_SECRET, TURNSTILE_SECRET
